<app-panel-shell>
  <h1 class="page-title">Disabilities</h1>
  <p class="page-subtitle">Catálogo de discapacidades del microservicio de deportes.</p>
  <p *ngIf="errorMessage" class="error-text">{{ errorMessage }}</p>

  <div class="card" style="margin-bottom: 16px;">
    <h3 class="section-title">Nueva discapacidad</h3>
    <form class="form-grid" [formGroup]="form" (ngSubmit)="create()">
      <label>Nombre <input formControlName="name" /></label>
      <label>Categoría
        <select formControlName="category">
          <option value="fisica">Física</option>
          <option value="visual">Visual</option>
          <option value="auditiva">Auditiva</option>
          <option value="intelectual">Intelectual</option>
          <option value="multiple">Múltiple</option>
        </select>
      </label>
      <label style="grid-column: 1 / -1;">Descripción <input formControlName="description" /></label>
      <div><button class="btn-primary" type="submit">Crear</button></div>
    </form>
  </div>

  <div class="card">
    <div class="list-item" *ngFor="let item of items">
      <div>
        <strong>{{ item.name }}</strong>
        <div class="kpi-sub">{{ item.category || '—' }} · {{ item.description || 'Sin descripción' }}</div>
      </div>
      <button class="btn-danger" type="button" (click)="remove(item)">Eliminar</button>
    </div>
  </div>
</app-panel-shell>
