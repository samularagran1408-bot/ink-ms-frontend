<div
  class="start-wrapper"
>
  <div class="gridOverlay"></div>
  <header class="top-header">
    <div class="brand-logo-container" (click)="goBack()">
      <button class="back-arrow-btn" aria-label="Volver">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
      </button>
      <span class="brand-name">INKLUSPORT</span>
    </div>

    <div class="user-top-icon" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A30D11" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
        <path d="M19 11v6m3-3h-6" />
      </svg>
    </div>
  </header>

  
  <main class="auth-card">
    <div class="hero-panel">
      <div class="hero-content">
        <span class="highlight-text">SIN LÍMITES</span>
        <h1 class="hero-title">
          Impulsamos el<br />deporte adaptado.
        </h1>
        <p class="hero-desc">
          Tecnología, inclusión y rendimiento para construir un futuro sin barreras.
        </p>
      </div>
    </div>

    <div class="form-panel">
      <div class="card-header">
        <h2 class="card-title">Bienvenido</h2>
        <div class="title-line"></div>
        <p class="card-subtitle">
          Tu plataforma para el deporte adaptado de alto rendimiento.
        </p>
      </div>

      <div class="button-group">
        <button type="button" class="login-button" (click)="goToLogin()">
          Iniciar sesión
          <span class="arrow">
            
          </span>
        </button>

        <button type="button" class="register-button" (click)="goToRegister()">
          <span class="register-content">
            <span>Registrarse</span>
            </span>
        </button>

        <button type="button" class="guest-button" (click)="goToGuest()">
          Iniciar como invitado
        </button>
      </div>

      <div class="auth-social">
        <span class="auth-divider">ÚNETE A LA COMUNIDAD</span>
        <div class="social-buttons">
          <button type="button" class="social-btn" title="Google" aria-label="Continuar con Google">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
            </svg>
          </button>
          <button type="button" class="social-btn" title="Correo" aria-label="Continuar con correo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A30D11" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
              <polyline points="22,6 12,13 2,6" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>
