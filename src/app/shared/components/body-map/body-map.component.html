        <ellipse class="zona" [class.zona--dolor]="esDolor('rodilla_izq')" cx="68" cy="324" rx="13" ry="12" />
        <ellipse class="zona" [class.zona--dolor]="esDolor('rodilla_der')" cx="112" cy="324" rx="13" ry="12" />

    <!-- Espalda -->
    <g transform="translate(210,8)">
      <text x="90" y="16" class="body-map-label">Espalda</text>
      <g transform="translate(0,22)">
        <ellipse class="zona" [class.zona--dolor]="esDolor('cabeza')" cx="90" cy="34" rx="26" ry="32" />
        <rect class="zona" [class.zona--dolor]="esDolor('cuello')" x="80" y="64" width="20" height="22" rx="6" />

        <ellipse class="zona" [class.zona--dolor]="esDolor('gluteo_der')" cx="70" cy="226" rx="22" ry="18" />
        <path class="zona" [class.zona--dolor]="esDolor('muslo_izq')" d="M98 240 h28 v68 c0 8-6 12-14 12s-14-4-14-12z" />
        <path class="zona" [class.zona--dolor]="esDolor('muslo_der')" d="M54 240 h28 v68 c0 8-6 12-14 12s-14-4-14-12z" />
        <ellipse class="zona" [class.zona--dolor]="esDolor('rodilla_izq')" cx="112" cy="324" rx="13" ry="12" />

        <ellipse class="zona" [class.zona--dolor]="esDolor('pie_der')" cx="64" cy="414" rx="18" ry="10" />
      </g>
    </g>
  </svg>

  <figcaption>
    <p class="body-map-limit" *ngIf="limitacion">
      <strong>Limitación:</strong> {{ limitacion }}
    </p>
    <ul class="body-map-tags" *ngIf="etiquetas.length">
      <li *ngFor="let etiqueta of etiquetas">{{ etiqueta }}</li>
    </ul>
    <p class="body-map-note">{{ nota }}</p>
  </figcaption>
</figure>
