<div class="accessibility-widget-container">
  <div class="accessibility-menu" [class.closing]="isClosing" *ngIf="isOpen">
    <button class="accessibility-option" (click)="toggleContrast()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
      </svg>
      <span>{{ (accessibilityService.highContrast$ | async) ? 'Contraste Normal' : 'Contraste' }}</span>
    </button>
    <button class="accessibility-option" (click)="increaseFont()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M11 5L6 19M16 12H6M18 19V11M22 15h-8" />
      </svg>
      <span>Aumentar letra</span>
    </button>
    <button class="accessibility-option" (click)="decreaseFont()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M11 5L6 19M16 12H6M15 15H9" />
      </svg>
      <span>Reducir letra</span>
    </button>
    <button class="accessibility-option" (click)="resetFont()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
      </svg>
      <span>Restablecer letra</span>
    </button>
  </div>
  <button
    class="accessibility-toggle-btn"
    (click)="toggleMenu()"
    aria-label="Menú de Accesibilidad"
  >
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <circle cx="12" cy="4" r="2" />
      <path d="M16 8h-8a2 2 0 0 0-2 2v2h2v8h3v-6h2v6h3v-8h2v-2a2 2 0 0 0-2-2z" />
    </svg>
    <span>Accesibilidad</span>
  </button>
</div>
