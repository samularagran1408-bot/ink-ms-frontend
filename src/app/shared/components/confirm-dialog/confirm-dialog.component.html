<div class="confirm-overlay" *ngIf="state as dialog" (click)="cancel()" role="presentation">
  <div
    class="confirm-card"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'confirm-title'"
    (click)="$event.stopPropagation()"
  >
    <div class="confirm-icon" [class.confirm-icon--danger]="dialog.tone === 'danger'">
      <span aria-hidden="true">!</span>
    </div>
    <h2 id="confirm-title" class="confirm-title">{{ dialog.title }}</h2>
    <p class="confirm-message">{{ dialog.message }}</p>
    <div class="confirm-actions">
      <button class="confirm-btn confirm-btn--ghost" type="button" (click)="cancel()">
        {{ dialog.cancelLabel }}
      </button>
      <button
        class="confirm-btn"
        [class.confirm-btn--danger]="dialog.tone === 'danger'"
        [class.confirm-btn--primary]="dialog.tone !== 'danger'"
        type="button"
        (click)="confirmAction()"
      >
        {{ dialog.confirmLabel }}
      </button>
    </div>
  </div>
</div>
